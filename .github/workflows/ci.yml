name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q openprism tooling tests
      - name: Test
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build

  learned-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install learned stack
        run: python -m pip install -e ".[dev,learned]"
      - name: Test learned fusion
        run: python -m unittest discover -s tests -p "test_openprism_learning.py" -v
