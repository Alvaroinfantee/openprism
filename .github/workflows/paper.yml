name: JOSS paper checks

on:
  push:
    paths:
      - "paper/**"
      - "tooling/validate_publication.py"
      - "CITATION.cff"
  pull_request:
    paths:
      - "paper/**"
      - "tooling/validate_publication.py"
      - "CITATION.cff"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tooling/validate_publication.py
