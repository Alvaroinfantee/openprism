name: Publication paper checks

on:
  push:
    paths:
      - "paper/**"
      - "tooling/validate_publication.py"
      - "tooling/validate_tmlr_draft.py"
      - "CITATION.cff"
  pull_request:
    paths:
      - "paper/**"
      - "tooling/validate_publication.py"
      - "tooling/validate_tmlr_draft.py"
      - "CITATION.cff"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tooling/validate_publication.py
      - run: python tooling/validate_tmlr_draft.py

  build-tmlr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Build anonymous TMLR draft
        working-directory: paper/tmlr
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          bibtex paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          ! grep -E "undefined citations|undefined references|There were undefined" paper.log
