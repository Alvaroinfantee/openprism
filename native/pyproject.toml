[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "openprism-native"
version = "0.1.0"
description = "Optional Rust image kernels for OpenPRISM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.2,<3"]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
locked = true
