[package]
name = "openprism-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Optional streaming image kernels for OpenPRISM"

[lib]
name = "openprism_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.27"
pyo3 = { version = "0.27", features = ["abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
